<path class="edge" d="M676,228 C676,243 676,241 676,256 L676,267" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M408,332 C408,347 408,345 408,360 L408,371" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M676,332 C676,347 676,345 676,360 L676,371" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M408,436 C408,451 408,449 408,464 L408,475" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M676,436 C676,451 676,449 676,464 L676,475" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M560,508 L525,508" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M256,508 L291,508" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M408,540 C408,555 140,553 140,568 L140,579" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M256,612 L291,612" marker-end="url(#wf-arrow)"/>
<path class="edge" d="M524,612 L559,612" marker-end="url(#wf-arrow)"/>
<path class="edge feed" d="M792,92 L797,92 Q807,92 807,102 L807,290 Q807,300 797,300 L793,300" marker-end="url(#wf-arrow)"/>
<text class="edge-label" x="802" y="152" text-anchor="end">dmo shells</text>
<rect class="card input" x="24" y="60" width="232" height="64" rx="10"/>
<text class="name" x="38" y="85">particles</text>
<text class="desc" x="38" y="105">GenericIO snapshots</text>
<rect class="card" x="292" y="60" width="232" height="64" rx="10"/>
<text class="name" x="306" y="85">construct_shell_sub</text>
<text class="desc" x="306" y="105">bin each sub-volume</text>
<circle class="dot-default" cx="507" cy="101" r="5"/>
<text class="count" x="496" y="105" text-anchor="end">×3,264</text>
<rect class="card" x="560" y="60" width="232" height="64" rx="10"/>
<text class="name" x="574" y="85">combine_shell_subs</text>
<text class="desc" x="574" y="105">sum them into shells</text>
<circle class="dot-default" cx="775" cy="101" r="5"/>
<text class="count" x="764" y="105" text-anchor="end">×51</text>
<rect class="card input" x="24" y="164" width="232" height="64" rx="10"/>
<text class="name" x="38" y="189">halo properties</text>
<text class="desc" x="38" y="209">GenericIO</text>
<rect class="card" x="292" y="164" width="232" height="64" rx="10"/>
<text class="name" x="306" y="189">construct_halo_catalog</text>
<text class="desc" x="306" y="209">halos of each shell</text>
<circle class="dot-highmem" cx="507" cy="205" r="5"/>
<text class="count" x="496" y="209" text-anchor="end">×51</text>
<rect class="card" x="560" y="164" width="232" height="64" rx="10" stroke-dasharray="5 3"/>
<text class="name" x="574" y="189">construct_baryonified_shell</text>
<text class="desc" x="574" y="209">optional: BaryonForge</text>
<circle class="dot-highmem" cx="775" cy="205" r="5"/>
<text class="count" x="764" y="209" text-anchor="end">×51</text>
<rect class="card" x="292" y="268" width="232" height="64" rx="10"/>
<text class="name" x="306" y="293">compute_shell_alms</text>
<text class="desc" x="306" y="313">harmonics, then Cls</text>
<circle class="dot-heavy" cx="507" cy="309" r="5"/>
<text class="count" x="496" y="313" text-anchor="end">×51</text>
<rect class="card" x="560" y="268" width="232" height="64" rx="10"/>
<text class="name" x="574" y="293">construct_kappa_map</text>
<text class="desc" x="574" y="313">Born convergence per shell</text>
<circle class="dot-default" cx="775" cy="309" r="5"/>
<text class="count" x="764" y="313" text-anchor="end">×51</text>
<rect class="card" x="292" y="372" width="232" height="64" rx="10"/>
<text class="name" x="306" y="397">compute_tidal_maps</text>
<text class="desc" x="306" y="417">tidal field, smoothed δ</text>
<circle class="dot-heavy" cx="507" cy="413" r="5"/>
<text class="count" x="496" y="417" text-anchor="end">×51</text>
<rect class="card" x="560" y="372" width="232" height="64" rx="10"/>
<text class="name" x="574" y="397">compute_kappa_alms</text>
<text class="desc" x="574" y="417">harmonics of κ, then Cls</text>
<circle class="dot-heavy" cx="775" cy="413" r="5"/>
<text class="count" x="764" y="417" text-anchor="end">×51</text>
<rect class="card input" x="24" y="476" width="232" height="64" rx="10"/>
<text class="name" x="38" y="501">n(z)</text>
<text class="desc" x="38" y="521">redshift distributions</text>
<rect class="card" x="292" y="476" width="232" height="64" rx="10"/>
<text class="name" x="306" y="501">construct_catalog_shell</text>
<text class="desc" x="306" y="521">galaxies of each shell</text>
<circle class="dot-highmem" cx="507" cy="517" r="5"/>
<text class="count" x="496" y="521" text-anchor="end">×51</text>
<rect class="card" x="560" y="476" width="232" height="64" rx="10"/>
<text class="name" x="574" y="501">compute_shear_maps</text>
<text class="desc" x="574" y="521">γ₁, γ₂ from κ</text>
<circle class="dot-heavy" cx="775" cy="517" r="5"/>
<text class="count" x="764" y="521" text-anchor="end">×51</text>
<rect class="card" x="24" y="580" width="232" height="64" rx="10"/>
<text class="name" x="38" y="605">merge_catalog</text>
<text class="desc" x="38" y="625">one catalog per bin</text>
<circle class="dot-highmem" cx="239" cy="621" r="5"/>
<text class="count" x="228" y="625" text-anchor="end">×5</text>
<rect class="card" x="292" y="580" width="232" height="64" rx="10"/>
<text class="name" x="306" y="605">compute_catalog_2pt_sub</text>
<text class="desc" x="306" y="625">TreeCorr, groups of pairs</text>
<circle class="dot-twopt" cx="507" cy="621" r="5"/>
<text class="count" x="496" y="625" text-anchor="end">×85</text>
<rect class="card" x="560" y="580" width="232" height="64" rx="10"/>
<text class="name" x="574" y="605">compute_catalog_2pt</text>
<text class="desc" x="574" y="625">SACC files and plots</text>
<circle class="dot-default" cx="775" cy="621" r="5"/>
<text class="count" x="764" y="625" text-anchor="end">×1</text>
<circle class="dot-default" cx="29" cy="688" r="5"/>
<text class="legend" x="39" y="692">default: 32 per node</text>
<circle class="dot-heavy" cx="208.0" cy="688" r="5"/>
<text class="legend" x="218.0" y="692">heavy: 1 per node</text>
<circle class="dot-highmem" cx="366.0" cy="688" r="5"/>
<text class="legend" x="376.0" y="692">highmem: 4 per node</text>
<circle class="dot-twopt" cx="538.0" cy="688" r="5"/>
<text class="legend" x="548.0" y="692">twopt: 2 per node</text>
<circle class="dot-input" cx="696.0" cy="688" r="5"/>
<text class="legend" x="706.0" y="692">input files</text>
<text class="sub" x="24" y="718">With baryons, the tasks after the shells run twice: on the dmo shells (dmo/) and on the baryonified ones (dmb/{tag}/).</text>
<text class="sub" x="24" y="738">×n: tasks of one realization of HACC091_1024 at nside 2048. A run resumes where it stopped: tasks skip what is written.</text>
</svg>
