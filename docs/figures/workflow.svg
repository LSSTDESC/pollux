<text class="name" x="574" y="525">compute_catalog_2pt</text>
<text class="desc" x="574" y="545">SACC files and plots</text>
<circle class="dot-default" cx="775" cy="541" r="5"/>
<text class="count" x="764" y="545" text-anchor="end">×1</text>
<rect class="card input" x="24" y="656" width="232" height="64" rx="10"/>
<text class="name" x="38" y="681">halo properties</text>
<text class="desc" x="38" y="701">GenericIO</text>
<rect class="card" x="292" y="656" width="232" height="64" rx="10"/>
<text class="name" x="306" y="681">construct_halo_catalog</text>
<text class="desc" x="306" y="701">halos of each shell</text>
<circle class="dot-highmem" cx="507" cy="697" r="5"/>
<text class="count" x="496" y="701" text-anchor="end">×51</text>
<rect class="card" x="560" y="656" width="232" height="64" rx="10"/>
<text class="name" x="574" y="681">construct_baryonified_shell</text>
<text class="desc" x="574" y="701">BaryonForge, in parallel</text>
<circle class="dot-highmem" cx="775" cy="697" r="5"/>
<text class="count" x="764" y="701" text-anchor="end">×51</text>
<text class="sub" x="24" y="850">One realization of HACC091_1024 at nside 2048 (pollux.pipeline.tasks). A run resumes where it stopped: tasks skip what is written.</text>
</svg>
